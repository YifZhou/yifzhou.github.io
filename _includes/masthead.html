{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button type="button" aria-label="Toggle navigation" aria-controls="site-nav-overflow" aria-expanded="false"><span class="navicon" aria-hidden="true"></span></button>
        <ul id="site-nav-links" class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/" aria-label="Home: {{ site.title }}">{{ site.name }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul id="site-nav-overflow" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  (function() {
    var button = document.querySelector("#site-nav button");
    var menu = document.getElementById("site-nav-overflow");
    if (!button || !menu) return;
    // Keep accessibility state aligned when the theme moves links on resize.
    function syncMenuState() {
      var expanded = !menu.classList.contains("hidden");
      button.setAttribute("aria-expanded", expanded ? "true" : "false");
      button.classList.toggle("close", expanded);
    }
    new MutationObserver(syncMenuState).observe(menu, {attributes: true, attributeFilter: ["class"]});
    document.addEventListener("keydown", function(event) {
      if (event.key !== "Escape" || menu.classList.contains("hidden")) return;
      menu.classList.add("hidden");
      syncMenuState();
      button.focus();
    });
  })();
</script>
