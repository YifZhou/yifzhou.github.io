  title: "Faintest planet ever imaged from Earth found after more than 10 years of hide-and-seek"
  summary: "ESO reports the discovery of β Pictoris d by the collaboration co-led by Ben Sutlieff and Markus Bonse, with Yifan as a co-author. The team combined new VLT observations with archival VLT and JWST images. This discovery is separate from our rotation measurement of β Pictoris b."
